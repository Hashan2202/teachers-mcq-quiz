<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ගුරු සේවා කාර්යක්ෂමතා කඩඉම – MCQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Sinhala:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a24;--paper:#f6f4ee;--card:#fff;--moss:#2f5d47;--dark:#20402f;--gold:#b9862f;--line:#dcd6c6;--ok:#2f7d4f;--okbg:#e6f4ea;--bad:#b3402c;--badbg:#fbe9e5;--muted:#6b6355}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota","Latha",system-ui,sans-serif}
header{background:var(--dark);color:#fff;padding:18px 16px 14px;border-bottom:4px solid var(--gold)}
.top{max-width:860px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 1.25rem/1.4 "Noto Serif Sinhala","Noto Sans Tamil",serif}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:999px}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--gold);font-weight:700}
nav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
#mods{max-width:860px;margin:auto;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
#mods button{flex:0 0 auto;scroll-snap-align:start;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
#mods button.on{background:var(--moss);border-color:var(--moss);color:#fff}
#mods small{opacity:.7;margin-inline-start:4px}
.wrap{max-width:860px;margin:auto;padding:14px 14px 40px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.stats b{color:var(--moss);font-size:1.05rem}
.track{height:7px;background:var(--line);border-radius:7px;margin:10px 0;overflow:hidden}
.fill{height:100%;width:0;background:var(--moss);transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:700}
.btn.gold{background:#fff6e0;border-color:var(--gold);color:#7a5514;font-weight:600}
.note{margin:12px 0 0;padding:8px 12px;background:#fff6e0;border-radius:8px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 8px rgba(32,64,47,.06)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.tag{background:#eaf1ec;color:var(--moss);padding:2px 10px;border-radius:999px}
.card h3{margin:0 0 12px;font-size:1.02rem;line-height:1.6}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;font:inherit;font-size:.95rem;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:46px}
.opt i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--paper);font-style:normal;font-weight:700;font-size:.8rem;display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--moss);background:#f3f8f4}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad);font-weight:600}
.fb{font-weight:700;font-size:.9rem;margin:4px 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.exp{margin-top:10px;background:#f4f1e6;border-inline-start:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:.88rem}
.exp b{display:block;color:#7a5514;margin-bottom:2px}
.nt{font-size:.75rem;color:var(--muted);margin:0 0 8px}
.end{text-align:center;margin-top:22px}
.end .btn{font-size:1rem;padding:12px 28px}
#ov{position:fixed;inset:0;background:rgba(20,30,24,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov.show{display:flex}
.dlg{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:24px;text-align:center;max-height:90vh;overflow:auto}
.dlg h2{margin:0 0 8px;font-size:1.1rem}
.big{font-size:3rem;font-weight:700;color:var(--moss);line-height:1.2}
.pct{font-size:1.4rem;font-weight:700;color:var(--gold)}
.dlg p{margin:8px 0;color:var(--muted);font-size:.92rem}
.dlg .tools{justify-content:center;margin-top:14px}
footer{text-align:center;font-size:.82rem;color:var(--muted);padding:18px 14px 34px;border-top:1px solid var(--line)}
footer a{color:var(--moss);font-weight:600}
</style>
</head>
<body>
<header><div class="top">
  <div><h1 id="hTitle"></h1><p id="hSub"></p></div>
  <div class="lang" id="lang"></div>
</div></header>
<nav><div id="mods"></div></nav>
<main class="wrap">
  <div class="bar">
    <div class="stats" id="stats"></div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="tools" id="tools"></div>
    <div class="note" id="note" style="display:none"></div>
  </div>
  <div id="list"></div>
  <div class="end" id="end"></div>
</main>
<div id="ov"><div class="dlg" id="dlg"></div></div>
<footer id="foot"></footer>

<script>
/* Each question: m=module, q/o/n/h = question/options/note/reference per language.

{"m":1,"q":{"si":"'ගැටලු විසඳීම' (Problem-Based Learning) හා 'සොයාබැලීමේ ඉගෙනුම' (Inquiry-Based Learning) අයත් වන්නේ කුමන ප්‍රවර්ගයටද?"},"o":{"si":["ගුරු කේන්ද්‍රීය ඉගෙනුම් ක්‍රම","සිසු කේන්ද්‍රීය ඉගෙනුම් ක්‍රම","තාක්ෂණය ඇසුරු කළ ඉගෙනුම් ක්‍රම පමණි","මෙයින් කිසිවක් නොවේ"]},"c":1,"h":{"si":"1.2 - විවිධ ඉගෙනුම් ක්‍රමවේද හා උපාය මාර්ග"},"n":{"si":"ගැටලු විසඳීම, සොයාබැලීමේ ඉගෙනුම සහ සහයෝගී ඉගෙනුම සිසු කේන්ද්‍රීය ඉගෙනුම් ක්‍රම යටතේ දැක්වේ; ගුරුවරයා පහසුකාරකයෙකු ලෙස පමණක් ක්‍රියා කරයි."}},{"m":1,"q":{"si":"'Feynman තාක්ෂණය' (Feynman Technique) යනු කුමන ඉගෙනුම් උපාය මාර්ගයද?"},"o":{"si":["ඉගෙන ගත් දේ නැවත නැවත කටපාඩම් කිරීම","සංකීර්ණ කරුණක් සරල භාෂාවෙන් අන් අයෙකුට පැහැදිලි කිරීමට උත්සාහ කිරීම","චිත්‍ර සටහන් ඇඳීම","පොත වසාගෙන ප්‍රශ්න අසා පිළිතුරු දීම"]},"c":1,"h":{"si":"1.2 - විවිධ ඉගෙනුම් උපාය මාර්ග"},"n":{"si":"Feynman තාක්ෂණයේදී ඔබ ඉගෙන ගත් දෙයක් නොදන්නා අයෙකුට හෝ කුඩා දරුවෙකුට සරල භාෂාවෙන් පැහැදිලි කිරීමට උත්සාහ කරයි; නොතේරෙන කොටස් එමගින් හඳුනාගත හැක."}},{"m":1,"q":{"si":"'නිර්මාණාත්මක තක්සේරුකරණය' (Formative Assessment) පිළිබඳ නිවැරදි ප්‍රකාශය කුමක්ද?"},"o":{"si":["වාර විභාග අවසානයේ පමණක් සිදු කරයි","ඉගෙනුම් ක්‍රියාවලිය අතරතුරදී සිසුන්ගේ දුර්වලතා හඳුනාගෙන ඉගැන්වීම වෙනස් කර ගැනීම සඳහා සිදු කරයි","සිසුවාට ශ්‍රේණියක් ලබාදීම පමණක් අරමුණයි","ජාතික මට්ටමේ විභාග පමණි"]},"c":1,"h":{"si":"1.2 - සිසු ඉගෙනුම තක්සේරුකරණය"},"n":{"si":"නිර්මාණාත්මක තක්සේරුකරණය ඉගෙනුම් ක්‍රියාවලිය අතරතුර සිදුවන අතර, එහි අරමුණ දුර්වලතා හඳුනාගෙන ඉගැන්වීම වෙනස් කර ගැනීමයි (උදා: පන්ති කාමර ප්‍රශ්න, කෙටි පරීක්ෂණ)."}},{"m":1,"q":{"si":"'නිර්මාණාත්මක ප්‍රතිපෝෂණය' (Constructive Feedback) විය යුත්තේ කෙසේද?"},"o":{"si":["අවිනිශ්චිත හා පොදු ලෙස","පැහැදිලි, නිශ්චිත සහ ක්‍රියාත්මක කළ හැකි ලෙස","සිසුවා අධෛර්යමත් කරන ලෙස","වාරයක් අවසානයේ පමණක්"]},"c":1,"h":{"si":"1.2 - ප්‍රතිපෝෂණය (Feedback)"},"n":{"si":"ප්‍රතිපෝෂණය පැහැදිලි, නිශ්චිත, කාලෝචිත සහ ක්‍රියාත්මක කළ හැකි ආකාරයට තිබිය යුතුය."}},{"m":1,"q":{"si":"සිසුවෙකුගේ දිගු කාලීන නිර්මාණ එකතු කරන 'වාර්තා ක්‍රමය' කුමක්ලෙස හඳුන්වයිද?"},"o":{"si":["Progress Report","Port ":{"si":"2.2 - වෘත්තිකයෙකුගේ මූලික ගුණාංග"},"n":{"si":"'ජීවිත කාලීන ඉගෙනුම්කරුවෙකු' ලෙස සිටීම යනු, තමන් උගත් දැනුමෙන් පමණක් සෑහීමකට පත් නොවී ක්ෂේත්‍රයේ නව වෙනස්කම් පිළිබඳ නිරන්තරයෙන් යාවත්කාලීන වීමයි."}},{"m":1,"q":{"si":"'වෘත්තිකභාවය' (Professionalism) පිළිබඳ නිර්වචනය වඩාත් නිවැරදිව විස්තර කරන්නේ කුමන ප්‍රකාශයද?"},"o":{"si":["හුදු රැකියාවක් කිරීම","වෘත්තීය කටයුතු සිදු කිරීමේදී අනුගමනය කරන උසස් ප්‍රමිතීන්, සදාචාරාත්මක හැසිරීම් රටා සහ කැපීම","වැටුප වැඩි කර ගැනීමට ගන්නා උත්සාහය","වැඩිපුර වේලාවක් කාර්යාලයේ රැඳී සිටීම"]},"c":1,"h":{"si":"2.3 - වෘත්තිකභාවය යනු කුමක්ද"},"n":{"si":"වෘත්තිකභාවය යනු ඔබේ 'සේවය' නොව එය ඔබ සිදු කරන 'ආකාරයයි' — උසස් ප්‍රමිතීන්, ආචාරධර්ම හා කැපීම ඒකාබද්ධ ප්‍රකාශනයකි."}},{"m":1,"q":{"si":"වෘත්තිකභාවය වැදගත් වන ප්‍රධාන හේතුවක් ලෙස දැක්වෙන්නේ කුමක්ද?"},"o":{"si":["එය ඉක්මනින් උසස්වීම් ලබා දෙන බැවින්","එය විශ්වාසය හා විශ්වාසනීයත්වය ගොඩනගන බැවින්","එය වැඩිපුර නිවාඩු ලබා දෙන බැවින්","එය රාජකාරි කාලය අඩු කරන බැවින්"]},"c":1,"h":{"si":"2.3 - වෘත්තිකභාවය වැදගත් වන්නේ ඇයි?"},"n":{"si":"වෘත්තිකභාවය මගින් සේවාලාභීන් අතර විශ්වාසය ගොඩනැගීම, කාර්යක්ෂමතාව ඉහළ නැංවීම සහ ආයතනයේ ප්‍රතිරූපය දියුණු කිරීම සිදුවේ."}},{"m":1,"q":{"si":"'පූර්ව සූදානම සහ සැලසුම් සහගත බව' යනු වෘත්තිකභාවය ප්‍රදර්ශනය වන කුමන ආකාරයේ හැසිරීමක්ද?"},"o":{"si":["රැස්වීම්වලට කලින් අවශ්‍ය කරුණු සූදානම් කර ගැනීම","වැඩ අහඹු ලෙස කිරීම","අන් අයගේ කාලය නොසලකා හැරීම","වගකීම් වැළැක්වීම"]},"c":0,"h":{"si":"2.3 - වෘත්තිකභාවය ප්‍රදර්ශනය වන හැසිරීම්"},"n":{"si":"වෘත්තිකයෙකු කිසිවිටෙකත් අහඹු ලෙස කාර්යයන් සිදු නොකරයි; සෑම දෙයක්ම කලින් සැලසුම් සහගතව සිදු කරයි."}},{"m":1,"q":{"si":"'ආදර්ශමත් පැවැත්ම' (Integrity & Professional Ethics) විස්තර කරන ගුරු ලක්ෂණය කුමක්ද?"},"o":{"si":["ගුරුවරයාගේ ඇඳුම, කථාව, කාල කළමනාකරණය හා හැසිරීම තුළින් ඉහළ වෘත්තීය ආචාරධර්ම ප්‍රදර්ශනය කිරීම","ගුරුවරයාගේ විෂය දැනුම පමණි","ගුරුවරයාගේ තාක්ෂණික දැනුම පමණි","ගුරුවරයාගේ වැටුප"]},"c":0,"h":{"si":"2.4 - වෘත්තීය ගුරුවරයෙකුගේ ලක්ෂණ"},"n":{"si":"ගුරුවරයා පවසන දේට වඩා ක්‍රියා කරන ආකාරය දරුවන් අනුකරණය කරන බැවින්, ඔහුගේ ඇඳුම, කථාව හා හැසිරීම තුළින් ඉහළ වෘත්තීය ආචාරධර්ම ප්‍රදර්ශනය කළ යුතුය."}},{"m":1,"q":{"si":"'ගුරු කාර්යසාධන ගොනුවක' (Teacher Performance Portfolio) ප්‍රධාන වැදගත්කම කුමක්ද?"},"o":{"si":["එය ගුරුවරයාගේ පෞද්ගලික දේපළකි","එය වෘත්තීය ප්‍රගතිය ඇගයීමට, ජයග්‍රහණ වාර්තාගත කිරීමට හා වෘත්තීය සැලසුම්කරණයට උපකාරී වේ","එය පාසලේ මුදල් වාර්තාවකි","එය සිසුන්ගේ ලකුණු පත්‍රිකාවකි"]},"c":1,"h":{"si":"2.4 - ගුරු කාර්යසාධන ගොනුවක ඇති වැදගත්කම"},"n":{"si":"කාර්යසාධන ගොනුව ගුරුවරයාගේ වෘත්තීය ජීවිතයේ 'දර්පණයක්' වන අතර, ස්වයං ප්‍රතිබිම්බනය, ජයග්‍රහණ වාර්තාකරණය, වෘත්තීය පිළිගැනීම හා අනාගත සැලසුම්කරණයට උපකාරී වේ."}},{"m":2,"q":{"si":"ඉගැන්වීම පිළිබඳ ප්‍රධාන භූමිකා තුන ලෙස ගුරුතුමා තුළ පහත දැක්වෙන්නේ සමානවාද?"},"o":{"si":["සම්ප්‍රේෂණ, ගනුදෙනු හා පරිණාමන භූමිකාව","නායකත්ව, ප්‍රශාසන, විනය භූමිකාව","මූල්‍ය, පරිපාලන, තාක්ෂණික භූමිකාව","දේශන, විභාග, වාර්තා භූමිකාව"]},"c":0,"h":{"si":"3.1-3.3 - ඉගැන්වීමේ භූමිකා"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] ඉගැන්වීමේ සම්ප්‍රේෂණ (Transmission), ගනුදෙනු (Transactional) සහ පරිණාමන (Transformational) භූමිකා තුනක් පවතී."}},{"m":2,"q":{"si":"ඉගෙනුම් න්‍යායක් ලෙස 'Behaviorism Learning Theory' සඳහා නිවැරදි සිංහල පදය කුමක්ද?"},"o":{"si":["ප්‍රජානන ඉගෙනුම් න්‍යාය","සමාජ ඉගෙනුම් න්‍යාය","චර්යාවාදී ඉගෙනුම් න්‍යාය","මානවවාදී ඉගෙනුම් න්‍යාය"]},"c":2,"h":{"si":"5.1 - චර්යාවාදී ඉගෙනුම් න්‍යාය"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] Behaviorism = චර්යාවාදී ඉගෙනුම් න්‍යාය — පිටතින් පෙනෙන හැසිරීම් වෙනස්කම් කෙරෙහි අවධානය යොමු කරයි."}},{"m":2,"q":{"si":"පහත සඳහන් ඒවායින් කුමක් 'Constructivism Learning Theory' ලෙස හැඳින්වේද?"},"o":{"si":["චර්යාවාදී ඉගෙනුම් න්‍යාය","නිර්මිතවාදී ඉගෙනුම් න්‍යාය","මානවවාදී ඉගෙනුම් න්‍යාය","සම්බන්ධක ඉගෙනුම් න්‍යාය"]},"c":1,"h":{"si":"5.1 - නිර්මිතවාදී ඉගෙනුම් න්‍යාය"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] Constructivism = නිර්මිතවාදී ඉගෙනුම් න්‍යාය — ඉගෙනුම්කරු තමාගේ අත්දැකීම් හා පූර්ව දැනුම උපයෝගී කරගෙන දැනුම ගොඩනගා ගනී (Piaget, Vygotsky)."}},{"m":2,"q":{"si":"ඉගෙනුම්-ඉගැන්වීම් ප්‍රවේශයකට උදාහරණයක් නොවන කරුණ කුමක්ද?"},"o":{"si":["ගුරු කේන්ද්‍රීය ප්‍රවේශය","සිසු කේන්ද්‍රීය ප්‍රවේශය","නිර්මාණාත්මක ප්‍රවේශය","සේවක පාදක ඉගෙනුම"]},"c":3,"h":{"si":"5.2 - ඉගෙනුම් ඉගැන්වීමේ ප්‍රවේශ"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] සටහන: 'සේවක පාදක ඉගෙනුම' යනු මෙහි සෘජුවම නිදසුනක් ලෙස දක්වා නැත; ගුරු කේන්ද්‍රීය, සිසු කේන්ද්‍රීය හා නිර්මාණාත්මක ප්‍රවේශ ප්‍රධාන ප්‍රවේශ වර්ගීකරණයට අයත් වේ."}},{"m":2,"q":{"si":"ඉගැන්වීම් ක්‍රමයක් ලෙස 'Demonstration Method' යනුවෙන් හඳුන්වනු ලබන්නේ කුමක්ද?"},"o":{"si":["දේශන ක්‍රමය","නිරූපණ ක්‍රමය","සාකච්ඡා ක්‍රමය","භූමිකා රංගන ක්‍රමය"]},"c":1,"h":{"si":"5.2 - ගුරු කේන්ද්‍රීය ඉගැන්වීමේ ක්‍රම"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] Demonstration Method = නිරූපණ ක්‍රමය — ගුරුවරයා ප්‍රායෝගිකව ක්‍රියාවක් පෙන්වා දෙයි."}},{"m":2,"q":{"si":"පන්ති කාමර ඉගෙනුම් ක්‍රියාකාරකම් වර්ගීකරණයට අයත් නොවන කරුණ කුමක්ද?"},"o":{"si":["තනි ක්‍රියාකාරකම්","යුගල ක්‍රියාකාරකම්","කුඩා කණ්ඩායම් ක්‍රියාකාරකම්","විශාල පන්ති ක්‍රියාකාරකම්"]},"c":3,"h":{"si":"5.2 - ඉගෙනුම් ඉගැන්වීම් ප්‍රවේශ හෝ නිදසුන්"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] සටහන: 'විශාල පන්ති ක්‍රියාකාරකම්' යනු මෙහි වර්ගීකරණයට අයත් නොවේ; තනි, යුගල හා කුඩා කණ්ඩායම් ලෙස ක්‍රියාකාරකම් වර්ග කර ඇත."}},{"m":2,"q":{"si":"ප්‍රතිබද්ධ ක්‍රියාවලියේදී 'Reflection-in-Action' යන්නෙහි අර්ථය කුමක්ද?"},"o":{"si":["ක්‍රියාව අතරතුර කරන ප්‍රතිබද්ධය","ක්‍රියාවෙන් පසු කරන ප්‍රතිබද්ධය","ක්‍රියාව සඳහා පෙර කරන ප්‍රතිබද්ධය","අතීත ක්‍රියාවක් පිළිබඳ ප්‍රතිබද්ධය"]},"c":0,"h":{"si":"6.3 - ක්‍රියාව තුළ ප්‍රත්‍යාවේක්ෂණය (Reflection-in-action)"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] Reflection-in-Action (Donald Schön) - ගුරුවරයා පන්ති කාමරයේ ඉගැන්වීමේ යෙදී සිටියදීම, තත්ත්වය තේරුම්ගෙන ක්ෂණිකව සිය ඉගැන්වීම වෙනස් කර ගැනීමයි."}},{"m":2,"q":{"si":"ඇගයීම ප්‍රධාන වශයෙන් බෙදිය හැකි ආකාර දෙකකි. ඒවා නම්?"},"o":{"si":["ලිඛිත සහ වාචික","සම්පිණ්ඩිත හා සම්භවන (Summative & Formative)","තනි හා කණ්ඩායම්","මූලික හා ද්විතීයික"]},"c":1,"h":{"si":"7.1 & 7.3 - තක්සේරුව හා ඇගයීම"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] ඇගයීම සම්පිණ්ඩිත (Summative) හා සම්භවන (Formative) ලෙස ප්‍රධාන ආකාර දෙකකට බෙදිය හැක."}},{"m":2,"q":{"si":"ඇගයීම් නිර්ණායක (Rubrics) වර්ග දෙකක් ලෙස දක්වා ඇත්තේ?"},"o":{"si":["සාකල්‍ය (Holistic) හා විශ්ලේෂණාත්මක (Analytic)","ලිඛිත හා වාචික","ප්‍රාථමික හා ද්විතීයික","තනි හා කණ්ඩායම්"]},"c":0,"h":{"si":"7.3 - ඇගයීම් නිර්ණායක"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] සාකල්‍ය ඇගයීම් නිර්ණායක (Holistic Rubrics) හා විශ්ලේෂණාත්මක ඇගයීම් නිර්ණායක (Analytic Rubrics) ලෙස ප්‍රධාන වර්ග දෙකකි."}},{"m":2,"q":{"si":"'Cognitive Learning Theory' යන්නෙහි සිංහල අර්ථය වන්නේ?"},"o":{"si":["චර්යාවාදී ඉගෙනුම් න්‍යාය","ප්‍රජානන ඉගෙනුම් න්‍යාය","මානවවාදී ඉගෙනුම් න්‍යාය","සමාජ ඉගෙනුම් න්‍යාය"]},"c":1,"h":{"si":"5.1 - ප්‍රජානන ඉගෙනුම් න්‍යාය"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] Cognitive Learning Theory = ප්‍රජානන ඉගෙනුම් න්‍යාය — දැනුම ග්‍රහණය, මතකයේ රැඳවීම හා අභ්‍යන්තර තොරතුරු සැකසුම කෙරෙහි අවධානය යොමු කරයි."}},{"m":2,"q":{"si":"ගුරුවරයෙකුට තම පන්ති කාමරයේදී කටයුතු කළ හැකි ප්‍රධාන භූමිකාවක් වන්නේ?"},"o":{"si":["පාලකයෙකු ලෙස","විනිසුරුවරයෙකු ලෙස","සුසාධකකාරකයෙකු ලෙස (Facilitator)","නිරීක්ෂකයෙකු ලෙස පමණි"]},"c":2,"h":{"si":"4 - ගුරුවරයා සුසාධකකාරකයෙකු ලෙස"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] නූතන අධ්‍යාපනයේදී විශේෂයෙන්ම සිසු කේන්ද්‍රීය ඉගැන්වීමේදී ගුරුවරයාගේ ප්‍රධාන භූමිකාව සුසාධකකාරකයෙකු (Facilitator) ලෙසය."}},{"m":2,"q":{"si":"'Connectivism/Connectionism Learning Theory' සඳහා නිවැරදි සිංහල පදය වන්නේ?"},"o":{"si":["සම්බන්ධක ඉගෙනුම් න්‍යාය","නිර්මිතවාදී ඉගෙනුම් න්‍යාය","සමාජ ඉගෙනුම් න්‍යාය","මානවවාදී ඉගෙනුම් න්‍යාය"]},"c":0,"h":{"si":"5.1 - සම්බන්ධක ඉගෙනුම් න්‍යාය (Thorndike)"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] Thorndike ගේ 'Puzzle Box' අත්හදාබැලීම මත පදනම් වූ මෙම න්‍යාය උත්තේජකය-ප්‍රතිචාරය (S-R Bond) අතර සම්බන්ධතාවක් ගොඩනැගීම විස්තර කරයි (සූදානම් වීමේ, අභ්‍යාසයේ, ප්‍රතිඵලයේ නියම)."}},{"m":2,"q":{"si":"ඉගැන්වීමේ ක්‍රමවේදයක 'ප්‍රධාන ක්‍රමවේද' ලෙස බෙදිය හැකි ආකාර දෙකකි. ඒවා නම්?"},"o":{"si":["ලිඛිත සහ ප්‍රායෝගික","ගුරු කේන්ද්‍රීය සහ ශිෂ්‍ය කේන්ද්‍රීය","දේශන සහ සාකච්ඡා","නිරූපණ සහ අන්තර්ක්‍රියාකාරී"]},"c":1,"h":{"si":"5.2 - ගුරු කේන්ද්‍රීය හා ශිෂ්‍ය කේන්ද්‍රීය ප්‍රවේශ"},"n":{"si":"[මුල් ප්‍රශ්නාවලියෙන්] ඉගැන්වීමේ ප්‍රධාන ක්‍රමවේද ගුරු කේන්ද්‍රීය (Teacher-Centered) නුදෙනු භූමිකාව"},"n":{"si":"ගනුදෙනු භූමිකාවේදී ගුරු-සිසු අන්තර්ක්‍රියාව හරහා දැනුම ගොඩනැගීම සිදුවේ; සාකච්ඡා, විවාද, ප්‍රතිපෝෂණය බහුලව යොදාගැනේ."}},{"m":2,"q":{"si":"'ඉගැන්වීමේ පරිණාමන භූමිකාව' (Transformational Role) අනුව ගුරුවරයා ක්‍රියා කරන්නේ කෙසේද?"},"o":{"si":["හුදෙක් තොරතුරු සම්ප්‍රේෂණය කරන්නෙකු ලෙස පමණි","සිසුවාගේ ජීවිතය, පෞරුෂය හා දැක්ම ධනාත්මක ලෙස පරිවර්තනය කරන උත්තේජකයෙකු ලෙස","පාලකයෙකු ලෙස","විනිසුරුවරයෙකු ලෙස"]},"c":1,"h":{"si":"3.3 - ඉගැන්වීමේ පරිණාමන භූමිකාව"},"n":{"si":"පරිණාමන භූමිකාව ඉගැන්වීමේ ඉහළම හා ගැඹුරුම මට්ටමේ කාර්යභාරය වන අතර, ගුරුවරයා සිසුවාගේ ආකල්ප, චරිතය හා ජීවිතයම පරිවර්තනය කරන උත්තේජකයෙකු ලෙස ක්‍රියා කරයි."}},{"m":2,"q":{"si":"'සම්ප්‍රදායික ගුරුවරයෙකු' සහ 'සුසාධකකාරකයෙකු' (Facilitator) අතර ප්‍රධාන වෙනස කුමක්ද?"},"o":{"si":["සම්ප්‍රදායික ගුරුවරයා දැනුම බෙදන්නෙකු වන අතර සුසාධකකාරකයා ඉගෙනුම පහසු කරන්නෙකි","දෙකම එකම දෙයයි","සුසාධකකාරකයා පමණක් විභාග පවත්වයි","සම්ප්‍රදායික ගුරුවරයා පමණක් ප්‍රශ්න අසයි"]},"c":0,"h":{"si":"4 - සුසාධකකාරකයෙකු සහ සම්ප්‍රදායික ගුරුවරයා අතර වෙනස"},"n":{"si":"සම්ප්‍රදායික ගුරුවරයාගේ අවධානය දේශන පැවැත්වීම හා විෂය කරුණු සම්ප්‍රේෂණය කෙරෙහි වන අතර, සුසාධකකාරකයාගේ අවධානය සාකච්ඡා හා ගවේෂණ හරහා ස්වාධීන ඉගෙනුම් හැකියාව වර්ධනය කිරීම කෙරෙහි යොමුවේ."}},{"m":2,"q":{"si":"පේව්ලොව් (Pavlov) විසින් හඳුන්වා දුන් 'සම්භාවිත අනුවර්තනය' (Classical Conditioning) පදනම් වන්නේ කුමක් මතද?"},"o":{"si":["ධනාත්මක ශක්තිමත් කිරීම","උත්තේජක දෙකක් එකිනෙක සම්බන්ධ වීම","ස්වයං-කාර්යක්ෂමතාව","ZPD (Zone of Proximal Development)"]},"c":1,"h":{"si":"5.1 - චර්යාවාදී න්‍යාය - සම්භාවිත අනුවර්තනය"},"n":{"si":"සීනුව නාද කිරීම (උදාසීන උත්තේජකය) හා ආහාර ලබාදීම (ස්වාභාවික උත්තේජකය) නිරන්තරයෙන් එකට සිදු කිරීමෙන් සුනඛයා සීනුවට පමණක් ප්‍රතිචාර දක්වයි."}},{"m":2,"q":{"si":"B.F. Skinner ගේ 'සාධක අනුවර්තනය' (Operant Conditioning) න්‍යායට අනුව, අප්‍රසන්න දෙයක් ඉවත් කිරීම මගින් යහපත් හැසිරීමක් දිරිමත් කිරීම හඳුන්වන්නේ කුමක් ලෙසද?"},"o":{"si":["ධනාත්මක ශක්තිමත් කිරීම (Positive Reinforcement)","ඍණාත්මක ශක්තිමත් කිරීම (Negative Reinforcement)","දඬුවම (Punishment)","සම්භාවිත අනුවර්තනය"]},"c":1,"h":{"si":"5.1 - චර්යාවාදී න්‍යාය - සාධක අනුවර්තනය"},"n":{"si":"ඍණාත්මක ශක්තිමත් කිරීම යනු අප්‍රසන්න යමක් ඉවත් කිරීම මගින් යහපත් හැසිරීමක් දිරිගැන්වීමයි; එය දඬුවමකට වඩා වෙනස්ය."}},{"m":2,"q":{"si":"Jean Piaget ගේ ප්‍රජානන න්‍යාය අනුව, පවතින දැනුම් පද්ධතියට අලුත් තොරතුරු ගලපාගැනීම හඳුන්වන්නේ කුමක් ලෙසද?"},"o":{"si":["ආත්මීයකරණය (Assimilation)","සමතුලිතකරණය (Accommodation)","ස්වයං-කාර්යක්ෂමතාව","ZPD"]},"c":0,"h":{"si":"5.1 - ප්‍රජානන න්‍යාය - අනුවර්තනය"},"n":{"si":"ආත්මීයකරණය (Assimilation) = පවතින දැනුම් පද්ධතියට අලුත් තොරතුරු ගලපාගැනීම; සමතුලිතකරණය (Accommodation) = පවතින දැනුම් පද්ධතිය අලුත් තොරතුරු අනුව වෙනස් කිරීම."}},{"m":2,"q":{"si":"ඇල්බට් බන්දුරාගේ (Albert Bandura) සමාජ ඉගෙනුම් න්‍යායට අනුව, යම් කාර්යයක් සාර්ථකව ඉටු කිරීමට හැකියාවක් ඇතැයි පුද්ගලයෙකු තුළ ඇති විශ්වාසය හඳුන්වන්නේ කුමක් ලෙසද?"},"o":{"si":["ස්වයං-කාර්යක්ෂමතාව (Self-efficacy)","ප්‍රතිඵල අපේක්ෂාව (Outcome Expectancy)","නිරීක්ෂණාත්මක ඉගෙනීම","ආදර්ශනය (Modeling)"]},"c":0,"h":{"si":"5.1 - සමාජ ඉගෙනුම් න්‍යාය - ස්වයං-කාර්යක්ෂමතාව"},"n":{"si":"ස්වයං-කාර්යක්ෂමතාව යනු යම් කාර්යයක් සාර්ථකව ඉටු කිරීමට හැකියාවක් ඇතැයි පුද්ගලයෙකු තුළ ඇති විශ්වාසයයි. එය ඉහළ නම් ඉගෙනීම වඩාත් සාර්ථක වේ."}},{"m":2,"q":{"si":"බන්දුරාගේ නිරීක්ෂණාත්මක ඉගෙනීමේ අදියර හතරට අයත් නොවන්නේ කුමක්ද?"},"o":{"si":["අවධානය (Attention)","රඳවා ගැනීම (Retention)","ප්‍රජනනය (Reproduction)","තක්සේරුව (Evaluation)"]},"c":3,"h":{"si":"5.1 - Bandura's 4 Processes"},"n":{"si":"බන්දුරාට අනුව නිරීක්ෂණාත්මක ඉගෙනීමේ අදියර හතර: අවධානය, රඳවා ගැනීම, ප්‍රජනනය සහ අභිප්‍රේරණයයි; 'තක්සේරුව' මෙයට අයත් නොවේ."}},{"m":2,"q":{"si":"'Zone of Proximal Development (ZPD)' සංකල්පය ඉදිරිපත් කළේ කවුරුන්ද?"},"o":{"si":["Jean Piaget","Lev Vygotsky","B.F. Skinner","Ivan Pavlov"]},"c":1,"h":{"si":"5.1 - සමාජ නිර්මිතවාදය (Vygotsky)"},"n":{"si":"Vygotsky ගේ 'සමීප සංවර්ධන කලාපය' (ZPD) අනුව, ගුරුවරයෙකුගේ හෝ දක්ෂ මිතුරෙකුගේ සහාය ඇතිව දරුවෙකුට තනිවම කළ නොහැකි දේ ඉගෙන ගත හැක."}},{"m":2,"q":{"si":"මානවවාදී ඉගෙනුම් න්‍යායේ ප්‍රධාන දාර්ශනිකයන් දෙදෙනා කවුරුන්ද?"},"o":{"si":["Piaget සහ Vygotsky","Carl Rogers සහ Abraham Maslow","Pavlov සහ Skinner","Bandura සහ Thorndike"]},"c":1,"h":{"si":"5.1 - මානවවාදී ඉගෙනුම් න්‍යාය"},"n":{"si":"මානවවාදී ඉගෙනුම් න්‍යාය Carl Rogers සහ Abraham Maslow ගේ අදහස් මත පදනම් වී ඇත; Maslow ගේ අවශ්‍යතා ධූරාවලියේ ඉහළම මට්ටම ස්වයං-යථාර්ථකරණයයි."}},{"m":2,"q":{"si":"Edward L. Thorndike ගේ 'ප්‍රතිඵලයේ නියමය' (Law of Effect) පවසන්නේ කුමක්ද?"},"o":{"si":["ක්‍රියාවක් නිතර පුහුණු කිරීමෙන් සම්බන්ධතාව ශක්තිමත් වේ","යම් ක්‍රියාවකින් තෘප්තිමත් ප්‍රතිඵලයක් ලැබේ නම් එම ක්‍රියාව නැවත සිදු කිරීමේ සම්භාවිතාව වැඩි වේ","ඉගෙනුම්කරු මානසිකව සූදානම් විය යුතුය","දැනුම සමාජීය වශයෙන් ගොඩනැගේ"]},"c":1,"h":{"si":"5.1 - සම්බන්ධක න්‍යාය - ප්‍රතිඵලයේ නියමය"},"n":{"si":"ප්‍රතිඵලයේ නියමය (Law of Effect) ඉතා වැදගත් වන අතර, තෘප්තිමත් ප්‍රතිඵලයක් ලබාදෙන ක්‍රියාවක් නැවත සිදු කිරීමේ සම්භාවිතාව වැඩි වන බව එයින් පැහැදිලි කරයි."}},{"m":2,"q":{"si":"'ව්‍යාපෘති පාදක ඉගෙනුම' (Project-Based Learning) හි සුවිශේෂී ලක්ෂණයක් කුමක්ද?"},"o":{"si":["ගුරුවරයා පමණක් සියල්ල තීරණය කරයි","සැබෑ ලෝකයේ ගැටලුවක් විසඳීම හරහා සිසුන් විෂය කරුණු උකහා ගනී","සිසුන් නිශ්ශබ්දව පොත් කියවති","එය කෙටිකාලීන ක්‍රියාකාරකමකි"]},"c":1,"h":{"si":"5.2 - ව්‍යාපෘති පාදක ඉගෙනුම (PBL)"},"n":{"si":"PBL හිදී සිසුන් සැබෑ ලෝකයේ ගැටලුවක් හෝ අභියෝගයක් විසඳීම හරහා දිගු කාලයක් පුරා ගැඹුරු දැනුමක් හා නිපුණතා ලබා ගනී."}},{"m":2,"q":{"si":"'සොයාබැලීමේ ඉගෙනුම' (Inquiry-Based Learning) හි වර්ග තුනෙන් 'විවෘත විමසුම' (Open Inquiry) හි ලක්ෂණය කුමක්ද?"},"o":{"si":["ගුරුවරයා ප්‍රශ්නය හා ක්‍රමවේදය ලබා දෙයි","ගුරුවරයා ප්‍රශ්නය පමණක් ලබා දෙයි","සිසුන්ම මනාපයෙන් පර්යේෂණ ප්‍රශ්නය තෝරාගෙන ක්‍රමවේදයද තීරණය කරයි","මෙයට ගුරුවරයාගේ මැදිහත්වීමක් නොමැත"]},"c":2,"h":{"si":"5.2 - වුහගත, මඟ පෙන්වන, විවෘත විමසුම්"},"n":{"si":"විවෘත විමසුමේදී (Open Inquiry) සිසුන්ම තමන්ගේ පර්යේෂණ ප්‍රශ්නය තෝරාගෙන, ක්‍රමවේදයද තමන්ම සකසා ගනී."}},{"m":2,"q":{"si":"'මිශ්‍ර ඉගෙනුම' (Blended Learning) යනු කුමක්ද?"},"o":{"si":["සම්පූර්ණයෙන්ම මාර්ගගත ඉගෙනුම","සම්ප්‍රදායික පන්ති කාමර ඉගැන්වීම හා අන්තර්ජාලය හරහා සිදුවන ඉගෙනුම එකට එකතු කිරීම","පොත්පත් පමණක් භාවිතා කරන ඉගෙනුම","විභාග පමණක් යොදාගන්නා ඉගෙනුම"]},"c":1,"h":{"si":"5.2 - තාක්ෂණය ඇසුරු කළ ඉගෙනුම් ක්‍රම"},"n":{"si":"මිශ්‍ර ඉගෙනුම (Blended Learning) සම්ප්‍රදායික මුහුණට මුහුණ ඉගැන්වීම හා මාර්ගගත ඉගෙනුම එකට එකතු කරයි."}},{"m":2,"q":{"si":"'ඉගැන්වීමේ ක්‍රමවේදය' (Teaching Methodology) හා 'ඉගැන්වීමේ ක්‍රම' (Teaching Methods) අතර වෙනස කුමක්ද?"},"o":{"si":["දෙකම එකම දෙයයි","ක්‍රමවේදය පුළුල් න්‍යායික ප්‍රවේශය වන අතර ක්‍රම යනු ක්‍රියාත්මක කරන නිශ්චිත ක්‍රියාමාර්ගයි","ක්‍රම පමණක් විද්‍යාත්මකයි","ක්‍රමවේදය සිසුන් සඳහා පමණි"]},"c":1,"h":{"si":"5.2 - ඉගැන්වීමේ ක්‍රමවේදය සහ ක්‍රම"},"n":{"si":"ක්‍රමවේදය (Methodology) යනු ඉගැන්වීම සඳහා අනුගමනය කරන පුළුල් ප්‍රවේශයයි; ක්‍රම (Methods) යනු එය ක්‍රියාවට නංවන නිශ්චිත ක්‍රියාමාර්ග (දේශන, සාකච්ඡා ආදිය)."}},{"m":2,"q":{"si":"'හොඳ ඉගැන්වීම් ක්‍රමවේදයක' අංගයක් ලෙස සැලකෙන්නේ නොවන්නේ කුමක්ද?"},"o":{"si":["ශිෂ්‍ය කේන්ද්‍රීය බව","අරමුණු සහගත බව","ප්‍රතිපෝෂණ නොදීම","තාක්ෂණික සාක්ෂරතාව"]},"c":2,"h":{"si":"5.2 - හොඳ ඉගැන්වීම් ක්‍රමවේදයක අංග"},"n":{"si":"ප්‍රතිපෝෂණ ලබාදීම (Constructive Feedback) හොඳ ඉගැන්වීම් ක්‍රමවේදයක අනිවාර්ය අංගයකි; 'ප්‍රතිපෝෂණ නොදීම' අංගයක් නොවේ."}},{"m":2,"q":{"si":"දේශන ක්‍රමයේ (Lecture Method) ප්‍රධාන අවාසියක් කුමක්ද?"},"o":{"si":["වැඩි කාලයක් ගතවීම","සිසුන් නිෂ්ක්‍රීය වීම නිසා ඔවුන්ගේ උනන්දුව ගිලිහීම","පාලනය අපහසු වීම","වැඩි වියදම් වීම"]},"c":1,"h":{"si":"5.2 - දේශන ක්‍රමයේ සීමාවන්"},"n":{"si":"දේශන ක්‍රමයේදී සිසුන් නිෂ්ක්‍රීයව සිටින බැවින් ඔවුන්ගේ අවධානය හා උනන්දුව ගිලිහීමට ඉඩ ඇත; එය මතකය (Memory) කෙරෙහි පමණක් අවධානය යොමු කරයි."}},{"m":2,"q":{"si":"සාකච්ඡා ක්‍රමයේ (Discussion Method) වාසියක් කුමක්ද?"},"o":{"si":["කාලය ඉතිරි කිරීම","විවේචනාත්මක චින්තනය හා සන්නිවේදන කුසලතා දියුණු කිරීම","නියමිත විෂය නිර්දේශය කෙටි කාලයකින් ආවරණය කිරීම","සියලුම සිසුන්ට එකසේ අවධානය දීම පහසු වීම"]},"c":1,"h":{"si":"5.2 - සාකච්ඡා ක්‍රමයේ වැදගත්කම"},"n":{"si":"සාකච්ඡා ක්‍රමය හරහා සිසුන් අදහස් හුවමාරු කරගන්නා විට විවේචනාත්මක චින්තනය හා සන්නිවේදන කුසලතා දියුණු වේ."}},{"m":2,"q":{"si":"නිරූපණ ක්‍රමයේ (Demonstration Method) ආරක්ෂිත අවදානමක් මත ුළ සහ ක්‍රියාව මත ප්‍රත්‍යාවේක්ෂණය අතර වෙනස"},"n":{"si":"'ක්‍රියාව තුළ' ප්‍රත්‍යාවේක්ෂණය පාඩම උගන්වන අතරතුරදී ක්ෂණික ගැලපීම් සඳහා සිදුවන අතර, 'ක්‍රියාව මත' ප්‍රත්‍යාවේක්ෂණය පාඩම අවසන් වූ පසු විශ්ලේෂණාත්මකව සිදුවේ."}},{"m":2,"q":{"si":"'ක්‍රියාව සඳහා ප්‍රත්‍යාවේක්ෂණය' (Reflection-for-Action) ප්‍රත්‍යාවේක්ෂණයේ වර්ග තුනෙන් සම්බන්ධ වන්නේ කුමන කාල අවධියටද?"},"o":{"si":["අතීතය","වර්තමානය","අනාගතය","මෙයට කාලයක් අදාළ නොවේ"]},"c":2,"h":{"si":"6.3 - ප්‍රත්‍යාවේක්ෂණ වර්ග තුන අතර සම්බන්ධය"},"n":{"si":"ක්‍රියාව සඳහා (For) = අනාගතය සඳහා පෙර සැලසුම් කිරීම; ක්‍රියාව තුළ (In) = වර්තමානය තුළ ගැලපීම්; ක්‍රියාව මත (On) = අතීතය විශ්ලේෂණය කිරීම."}},{"m":2,"q":{"si":"ප්‍රත්‍යාවේක්ෂණශීලී ඉගැන්වීම (Reflective Teaching) ගුරුවරයෙකුට වැදගත් වන ප්‍රධාන හේතුවක් නොවන්නේ කුමක්ද?"},"o":{"si":["වෘත්තීය වර්ධනය හා දියුණුව","ඉගැන්වීමේ ගුණාත්මකභාවය ඉහළ නැංවීම","සිසුන්ගේ ඉගෙනුම් අවශ්‍යතා හඳුනා ගැනීම","වැටුප වැඩි කර ගැනීම"]},"c":3,"h":{"si":"6.4 - ප්‍රත්‍යාවේක්ෂණයේ වැදගත්කම"},"n":{"si":"ප්‍රත්‍යාවේක්ෂණයේ වැදගත්කම වෘත්තීය සංවර්ධනය, ගුණාත්මකභාවය ඉහළ නැංවීම, සිසුන්ගේ අවශ්‍යතා හඳුනාගැනීම, ගැටළු විසඳීමේ හැකියාව හා ආත්ම විශ්වාසය වර්ධනය කිරීම කෙරෙහි යොමුවේ; 'වැටුප වැඩි කර ගැනීම' මෙයට අදාළ නොවේ."}},{"m":2,"q":{"si":"'සම්පිණ්ඩිත ඇගයීම' (Summative Assessment) හඳුන්වන තවත් නාමයක් කුමක්ද?"},"o":{"si":["Assessment for Learning","Assessment of Learning","Assessment as Learning","Peer Assessment"]},"c":1,"h":{"si":"7.1 - සම්පිණ්ඩිත ඇගයීම"},"n":{"si":"සම්පිණ්ඩිත ඇගයීම 'ඉගෙනුමේ ඇගයීම' (Assessment of Learning) ලෙස හඳුන්වන අතර, එය ඉගෙනුම් ක්‍රියාවලියක අවසානයේදී 'ඉගෙන ගත්තේ කුමක්ද?' යන්න මැන බලයි."}},{"m":2,"q":{"si":"'සම්භවන ඇගයීම' (Formative Assessment) හඳුන්වන තවත් නාමයක් කුමක්ද?"},"o":{"si":["Assessment of Learning","Assessment for Learning","Final Examination","Summative Test"]},"c":1,"h":{"si":"7.3 - සම්භවන ඇගයීම"},"n":{"si":"සම්භවන ඇගයීම 'ඉගෙනීම සඳහා වන ඇගයීමක්' (Assessment for Learning) ලෙස හඳුන්වන අතර, එහි ප්‍රධාන අරමුණ ලකුණු ලබාදීම නොව ඉගැන්වීම වැඩිදියුණු කිරීමයි."}},{"m":2,"q":{"si":"'Exit Ticket' හෝ 'කෙටි ප්‍රශ්න   m:{1:"මොඩියුල 1 – ගුරු නිපුණතා රාමුව හා වෘත්තිකභාවය",2:"මොඩියුල 2 – ඉගැන්වීම් ක්‍රමවේදය",3:"මොඩියුල 3 – අධ්‍යාපන තාක්ෂණය (EdTech)",4:"මොඩියුල 4 – අධ්‍යාපන නීතිය"},
  qs:"ප්‍රශ්න",ans:"පිළිතුරු දුන්",cor:"නිවැරදි",sc:"ලකුණු",shuf:"🔀 මුසු කරන්න",rst:"🔄 නැවත ආරම්භ",fin:"🏁 අවසන් කර ලකුණු බලන්න",
  rev:"නිවැරදි පිළිතුර බලන්න",okm:"✔ නිවැරදියි!",badm:"✘ වැරදියි",exp:"පැහැදිලි කිරීම",ref:"යොමුව",
  notr:"මෙම ප්‍රශ්නයේ පරිවර්තනය තවම නැත – සිංහලෙන් පෙන්වයි.",rt:"ඔබේ ප්‍රතිඵලය",of:"න්",un:"පිළිතුරු නොදුන්",
  rw:"වැරදි පිළිතුරු නැවත බලන්න",ag:"නැවත උත්සාහ කරන්න",cl:"වසන්න",all2:"සියල්ල පෙන්වන්න",wo:"දැන් පෙන්වන්නේ වැරදි / නොකළ ප්‍රශ්න පමණි.",
  g:["විශිෂ්ටයි! 🎉","ඉතා හොඳයි 👏","හොඳයි, තව ටිකක් පුහුණු වන්න","තවත් අධ්‍යයනය කර නැවත උත්සාහ කරන්න"],
  cr:"නිර්මාණය",ct:"සම්බන්ධ වන්න",ov:"සම්පූර්ණ ලකුණු (සියලුම මොඩියුල)",empty:"මෙම මොඩියුලයේ පෙන්වීමට ප්‍රශ්න නැත."},
 ta:{t:"ஆசிரியர் சேவைத் திறன் தடை – MCQ பயிற்சி",s:"தொகுதிகள் 1 – 4 · அனைத்து வினாக்களும் ஒரே இடத்தில்",all:"அனைத்து வினாக்கள்",
  m:{1:"தொகுதி 1 – ஆசிரியர் திறன் கட்டமைப்பு & தொழில்சார்மை",2:"தொகுதி 2 – கற்பித்தல் முறையியல்",3:"தொகுதி 3 – கல்வித் தொழில்நுட்பம் (EdTech)",4:"தொகுதி 4 – கல்விச் சட்டம்"},
  qs:"வினாக்கள்",ans:"பதிலளித்தவை",cor:"சரியானவை",sc:"மதிப்பெண்",shuf:"🔀 கலக்கு",rst:"🔄 மீண்டும் தொடங்கு",fin:"🏁 முடித்து மதிப்பெண் பார்",
  rev:"சரியான விடையைப் பார்",okm:"✔ சரி!",badm:"✘ தவறு",exp:"விளக்கம்",ref:"குறிப்பு",
  notr:"இந்த வினாவின் மொழிபெயர்ப்பு இன்னும் இல்லை – சிங்களத்தில் காட்டப்படுகிறது.",rt:"உங்கள் முடிவு",of:"இல்",un:"பதிலளிக்காதவை",
  rw:"தவறான விடைகளை மீளப் பார்",ag:"மீண்டும் முயற்சி",cl:"மூடு",all2:"அனைத்தையும் காட்டு",wo:"தவறான / பதிலளிக்காத வினாக்கள் மட்டும் காட்டப்படுகின்றன.",
  g:["மிகச் சிறப்பு! 🎉","மிக நன்று 👏","நன்று, இன்னும் சிறிது பயிற்சி செய்யுங்கள்","மேலும் படித்து மீண்டும் முயற்சிக்கவும்"],
  cr:"உருவாக்கியவர்",ct:"தொடர்புக்கு",ov:"மொத்த மதிப்பெண் (அனைத்துத் தொகுதிகளும்)",empty:"இந்தத் தொகுதியில் காட்ட வினாக்கள் இல்லை."},
 en:{t:"Teacher Service Efficiency Bar – MCQ Practice",s:"Modules 1 – 4 · all questions in one place",all:"All questions",
  m:{1:"Module 1 – Teacher Competency Framework & Professionalism",2:"Module 2 – Teaching Methodology",3:"Module 3 – Educational Technology (EdTech)",4:"Module 4 – Education Law"},
  qs:"Questions",ans:"Answered",cor:"Correct",sc:"Score",shuf:"🔀 Shuffle",rst:"🔄 Restart",fin:"🏁 Finish & see score",
  rev:"Show correct answer",okm:"✔ Correct!",badm:"✘ Incorrect",exp:"Explanation",ref:"Reference",
  notr:"This question is not translated yet – shown in Sinhala.",rt:"Your result",of:"of",un:"Unanswered",
  rw:"Review wrong answers",ag:"Try again",cl:"Close",all2:"Show all",wo:"Showing wrong / unanswered questions only.",
  g:["Excellent! 🎉","Very good 👏","Good – a little more practice","Keep studying and try again"],
  cr:"Created by",ct:"Contact",ov:"Overall score (all modules)",empty:"No questions to show in this module."}
};
const LN={si:"සිංහල",ta:"தமிழ்",en:"English"};
let lang="si",mod=0,wrongOnly=false;
try{lang=localStorage.getItem("qlang")||"si"}catch(e){}
if(!UI[lang])lang="si";
const ans={},shown={},orders={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=o=>o?(o[lang]??o.si??""):"";
const hasTr=q=>lang==="si"||!!(q.q[lang]&&q.o[lang]);
const ui=()=>UI[lang];
const ids=()=>{const k=mod;if(!orders[k])orders[k]=Q.map((_,i)=>i).filter(i=>!k||Q[i].m===k);return orders[k]};
const view=()=>ids().filter(i=>!wrongOnly||ans[i]!==Q[i].c);
const stat=l=>({n:l.length,a:l.filter(i=>i in ans).length,c:l.filter(i=>ans[i]===Q[i].c).length});

function card(i,n,total){
  const q=Q[i],u=ui(),done=i in ans,right=ans[i]===q.c,lg=hasTr(q)?lang:"si";
  const opts=q.o[lg].map((t,j)=>{
    let cl="";
    if(done){if(j===ans[i])cl=right?"ok":"bad";else if(j===q.c&&(right||shown[i]))cl="ok"}
    return `<button class="opt ${cl}" data-i="${i}" data-j="${j}" ${done?"disabled":""}><i>${"ABCD"[j]}</i><span>${esc(t)}</span></button>`;
  }).join("");
  let fb="",ex="";
  if(done){
    fb=`<div class="fb ${right?"ok":"bad"}">${right?u.okm:u.badm}</div>`;
    if(!right&&!shown[i])fb+=`<button class="btn gold" data-rev="${i}">👁 ${u.rev}</button>`;
    const nt=T(q.n),h=T(q.h);
    if((right||shown[i])&&(nt||h))ex=`<div class="exp"><b>${u.exp}${h?" · "+esc(h):""}</b>${nt&&nt!==h?esc(nt):""}</div>`;
  }
  return `<article class="card" id="c${i}"><div class="meta"><span class="tag">${esc(u.m[q.m])}</span><span>${n} / ${total}</span></div>
  ${hasTr(q)?"":`<p class="nt">ⓘ ${u.notr}</p>`}<h3>${esc(T(q.q))}</h3>${opts}${fb}${ex}</article>`;
}
function stats(){
  const u=ui(),s=stat(ids());
  $("stats").innerHTML=`<span>${u.qs}: <b>${s.n}</b></span><span>${u.ans}: <b>${s.a}</b></span><span>${u.cor}: <b>${s.c}</b></span><span>${u.sc}: <b>${s.a?Math.round(s.c/s.a*100):0}%</b></span>`;
  $("fill").style.width=(s.n?s.a/s.n*100:0)+"%";
}
function chrome(){
  const u=ui();
  document.documentElement.lang=lang;document.title=u.t;
  $("hTitle").textContent=u.t;$("hSub").textContent=u.s;
  $("lang").innerHTML=Object.keys(LN).map(k=>`<button data-l="${k}" class="${k===lang?"on":""}">${LN[k]}</button>`).join("");
  const tabs=[[0,u.all,Q.length]].concat([1,2,3,4].map(m=>[m,u.m[m],Q.filter(q=>q.m===m).length]));
  $("mods").innerHTML=tabs.map(t=>`<button data-m="${t[0]}" class="${t[0]===mod?"on":""}">${esc(t[1])}<small>(${t[2]})</small></button>`).join("");
  $("tools").innerHTML=`<button class="btn" data-a="shuf">${u.shuf}</button><button class="btn" data-a="rst">${u.rst}</button><button class="btn pri" data-a="fin">${u.fin}</button>`;
  $("foot").innerHTML=`${u.cr}: <b>T.M.Hashan Pradeep</b> · ${u.ct}: <a href="mailto:tmhashanpk@gmail.com">tmhashanpk@gmail.com</a>`;
}
function render(){
  const u=ui(),l=view();
  chrome();stats();
  const nt=$("note");nt.style.display=wrongOnly?"block":"none";
  nt.innerHTML=`${u.wo} <button class="btn" data-a="all">${u.all2}</button>`;
  $("list").innerHTML=l.length?l.map((i,n)=>card(i,n+1,l.length)).join(""):`<p style="text-align:center;color:var(--muted);margin-top:30px">${u.empty}</p>`;
  $("end").innerHTML=l.length?`<button class="btn pri" data-a="fin">${u.fin}</button>`:"";
}
function refresh(i){
  const l=view(),el=$("c"+i);
  if(el)el.outerHTML=card(i,l.indexOf(i)+1,l.length);
  stats();
}
function result(){
  const u=ui(),s=stat(ids()),all=stat(Q.map((_,i)=>i)),p=s.n?Math.round(s.c/s.n*100):0;
  const g=u.g[p>=85?0:p>=65?1:p>=45?2:3];
  const name=mod?u.m[mod]:u.all;
  $("dlg").innerHTML=`<h2>${u.rt}</h2><p>${esc(name)}</p><div class="big">${s.c} / ${s.n}</div><div class="pct">${p}%</div>
  <p><b>${g}</b></p><p>${u.cor}: ${s.c} · ${u.badm.replace("✘ ","")}: ${s.a-s.c} · ${u.un}: ${s.n-s.a}</p>
  ${mod?`<p>${u.ov}: <b>${all.c} / ${all.n}</b></p>`:""}
  <div class="tools"><button class="btn pri" data-a="rw">${u.rw}</button><button class="btn" data-a="ag">${u.ag}</button><button class="btn" data-a="cl">${u.cl}</button></div>`;
  $("ov").classList.add("show");
}
function reset(){
  ids().forEach(i=>{delete ans[i];delete shown[i]});wrongOnly=false;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.l){lang=d.l;try{localStorage.setItem("qlang",lang)}catch(x){}render()}
  else if(d.m!==undefined){mod=+d.m;wrongOnly=false;render();scrollTo(0,0)}
  else if(d.j!==undefined){const i=+d.i;if(!(i in ans)){ans[i]=+d.j;refresh(i)}}
  else if(d.rev!==undefined){shown[+d.rev]=true;refresh(+d.rev)}
  else if(d.a==="shuf"){const a=ids();for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}render()}
  else if(d.a==="rst"){reset();render();scrollTo(0,0)}
  else if(d.a==="fin")result();
  else if(d.a==="cl")$("ov").classList.remove("show");
  else if(d.a==="ag"){$("ov").classList.remove("show");reset();render();scrollTo(0,0)}
  else if(d.a==="rw"){$("ov").classList.remove("show");wrongOnly=true;render();scrollTo(0,0)}
  else if(d.a==="all"){wrongOnly=false;render()}
});
render();
</script>
</body>
</html>
